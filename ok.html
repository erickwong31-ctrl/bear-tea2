<!DOCTYPE html>
<html lang="zh-HK">
<head>

<title>付款成功</title>
<style>

  .box{background:#fff;padding:48px 40px;border-radius:20px;box-shadow:0 12px 40px rgba(120,85,40,.15);max-width:340px}

  h1{font-size:24px;margin:12px 0 6px;color:#2f7d4f}
  p{font-size:14px;color:#9c8b74;line-height:1.7}

<body>
  <div class="box">
    <div class="ok">✅</div>
    <h1>付款成功</h1>
    <p>感謝惠顧熊茶館！<br>我們已收到您的訂單，<br>請留意取餐通知。</p>
    <a href="/">返回重新點單</a>
  </div>

</html>
