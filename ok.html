<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>付款成功</title>
<style>
  body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;margin:0;min-height:100vh;background:#f4efe6;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:#fff;padding:40px 36px;border-radius:20px;box-shadow:0 12px 40px rgba(120,85,40,.15);max-width:340px;width:100%;text-align:center}
  .ok{font-size:60px}
  h1{font-size:24px;margin:10px 0 6px;color:#2f7d4f}
  p{font-size:14px;color:#9c8b74;line-height:1.7;margin:0}
  .ticket{margin:18px 0 6px;font-size:15px;color:#3a2f23}
  .ticket b{display:inline-block;font-size:44px;color:#e07b39;letter-spacing:2px;margin:6px 0 0;font-weight:800}
  .tip{font-size:12px;color:#b9a98c;margin-top:8px}
  a{display:inline-block;margin-top:22px;background:#8a5a2b;color:#fff;padding:12px 28px;border-radius:10px;text-decoration:none;font-size:15px}
</style>
</head>
<body>
  <div class="box">
    <div class="ok">✅</div>
    <h1>付款成功</h1>
    <p>感謝惠顧熊茶館！<br>您的訂單已收到。</p>
    <div class="ticket">你的取餐號碼是
      <div id="ticketNum">…</div>
    </div>
    <div class="tip">請留意叫號取餐</div>
    <a href="/">返回重新點單</a>
  </div>

<script>
(function(){
  var num=document.getElementById('ticketNum');
  // 優先讀取本機存的取餐號（一定顯示）
  var local=null;
  try{local=localStorage.getItem('bt_ticket')}catch(e){}
  if(local){
    num.innerHTML='<b>'+local+'</b>';
    return;
  }
  // 沒有本機號才嘗試用 Stripe session 查
  var s=new URLSearchParams(location.search).get('session_id');
  if(s){
    fetch('/api/order?session_id='+encodeURIComponent(s))
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.ticket){num.innerHTML='<b>'+d.ticket+'</b>'}
        else{num.innerHTML='—'}
      })
      .catch(function(){num.innerHTML='—'});
  }else{
    num.innerHTML='—';
  }
})();
</script>
</body>
</html>
